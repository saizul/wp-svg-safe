<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <clipPath id="clip" clipPathUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="20"/>
    </clipPath>
    <mask id="hole" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <rect width="48" height="48" fill="#fff"/>
      <circle cx="24" cy="24" r="8" fill="#000"/>
    </mask>
    <pattern id="stripes" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2" height="4" fill="#64748b"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <g clip-path="url(#clip)" mask="url(#hole)">
    <rect width="48" height="48" fill="url(#stripes)"/>
  </g>
  <line x1="4" y1="44" x2="20" y2="28" stroke="#000" marker-end="url(#arrow)"/>
</svg>
