<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <filter id="light">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="noise"/>
    <feDiffuseLighting in="noise" lighting-color="#fde047" surfaceScale="2" result="lit">
      <feDistantLight azimuth="45" elevation="60"/>
    </feDiffuseLighting>
    <feComposite in="lit" in2="SourceGraphic" operator="in"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.8" intercept="0"/>
    </feComponentTransfer>
  </filter>
  <g transform="translate(40 40) rotate(15)" opacity="0.95">
    <circle r="30" filter="url(#light)" fill="#000" fill-opacity="1" stroke="#a16207" stroke-dasharray="4 2" stroke-dashoffset="1" vector-effect="non-scaling-stroke"/>
  </g>
</svg>
