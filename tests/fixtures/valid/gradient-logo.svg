<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 40" role="img" aria-labelledby="t d">
  <title id="t">Example logo</title>
  <desc id="d">A rounded badge with a gradient</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <circle id="dot" r="4"/>
  </defs>
  <rect x="0" y="0" width="120" height="40" rx="8" fill="url(#grad)"/>
  <ellipse cx="60" cy="20" rx="50" ry="14" fill="url('#glow')"/>
  <use xlink:href="#dot" x="14" y="20" fill="#fff"/>
  <use href="#dot" x="106" y="20" fill="#fff"/>
</svg>
